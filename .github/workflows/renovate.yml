name: Renovate Application
on:
  # Vorübergehend deaktiviert - nur manueller Trigger
  # schedule:
  #   - cron: '0 2 * * *'
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

permissions:
  contents: read

jobs:
  renovate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.6
        with:
          token: ${{ secrets.BOT_PAT }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'guided-traffic/teddycloud-cover-printer'
          RENOVATE_REQUIRE_CONFIG: 'required'
